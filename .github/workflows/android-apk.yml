name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🏗️ Build frontend web assets
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔧 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🔑 Setup Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/glow-release.keystore
            cat <<EOF > android/keystore.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=glow-release.keystore
          EOF
            echo "HAS_RELEASE_KEYSTORE=true" >> $GITHUB_ENV
            echo "Keystore setup successfully for signed release!"
          else
            echo "No keystore secret found, will build debug APK."
          fi

      - name: 🚀 Build APK (Signed Release or Debug Fallback)
        run: |
          cd android
          if [ "$HAS_RELEASE_KEYSTORE" = "true" ] && [ -f "keystore.properties" ]; then
            echo "Building Signed Release APK..."
            ./gradlew assembleRelease --no-daemon
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
          else
            echo "Building Debug APK (keystore not available)..."
            ./gradlew assembleDebug --no-daemon
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
          fi

      - name: 📤 Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Glow-Android-APK
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: 🏷️ Rename APK for Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            VERSION="v1.1.8"
          fi
          cp "${{ env.APK_PATH }}" "./Glow-${VERSION}.apk"
          echo "APK_FILE=./Glow-${VERSION}.apk" >> $GITHUB_ENV

      - name: 🏷️ Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
