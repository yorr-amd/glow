name: Update RPM Repo

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-repo:
    name: 📦 Generate & Publish RPM Repo
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: 📦 Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c curl wget

      - name: 📥 Fetch RPMs from all releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p rpm
          gh release list --limit 10 --json tagName --jq '.[].tagName' | while read -r tag; do
            echo "Checking release: $tag"
            gh release download "$tag" --pattern "*rpm" --dir rpm/ --clobber || true
          done
          ls -lh rpm/

      - name: ⚙️ Generate Repository Metadata
        run: |
          createrepo_c --verbose --update rpm/

      - name: 📝 Update files
        run: |
          cat << 'EOF' > rpm/glow-tracker.repo
[glow-tracker]
name=Glow ✦ Skincare Companion Repository
baseurl=https://yorr-amd.github.io/glow/rpm/
enabled=1
gpgcheck=0
repo_gpgcheck=0
type=rpm-md
EOF
          cp rpm/glow-tracker.repo ./glow-tracker.repo
          touch .nojekyll

      - name: 🚀 Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes in RPM repository"
          else
            git commit -m "chore(repo): update RPM metadata [skip ci]"
            git push origin gh-pages
          fi
