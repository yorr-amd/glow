name: Tauri Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.1.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 📦 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🏗️ Build frontend web assets
        run: npm run build

      - name: 🚀 Build and Release Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Glow ✦ Skincare Companion ${{ github.ref_name }}'
          releaseBody: |
            ## 🌸 Glow ✦ Skincare Companion ${{ github.ref_name }}
            
            ### ✨ What's New in ${{ github.ref_name }} / Yang Baru di ${{ github.ref_name }}:
            - 🌸 **Official Rebranding**: Renamed officially to **Glow ✦ Skincare Companion**.
            - 📱 **Official Android APK Release**: Now available on Android mobile with full responsive UI & 3D WebGL graphics!
            - 🌐 **Full Bilingual Support**: Added instant language toggle (**ID 🇮🇩 | EN 🇬🇧**) in the top navigation bar. Routine cards, tooltips, safety locks, and live clocks update reactively without reloading.
            - ☀️ **4-Phase 3D Celestial Atmosphere**: Real-time astronomical sky visualization powered by Three.js (Morning sun flare, Midday volumetric clouds, Sunset rose-gold horizon, and Night violet moon with 120+ twinkling stars & shooting stars).
            - 🧴 **3D Procedural Serum Bottle**: Interactive 3D glass serum bottle with real-time liquid level and micro-bubbles that adapt to your routine completion percentage.
            - 🔒 **Exfoliation Safety Lock**: Exfoliating Toner strictly unlocks only on Wednesday & Saturday nights to safeguard your skin barrier.
            - 🔥 **Consecutive Streak Counter**: Real-time streak tracking with visual fire glow for unbroken consistency.
            - 📅 **Skincare History Journal & Product Shelf**: 30-day recap journal and virtual vanity shelf with PAO (Period After Opening) tracking.
            - 🔄 **In-App Auto Update**: Desktop & Android automatic update checker and 1-tap updater.
            - 🛡️ **100% Offline-First**: Zero tracking, all routine data stays securely on your local device.
            
            ---
            
            ### 📦 Downloads / Unduhan:
            - 🪟 **Windows Installer**: `Glow_${{ github.ref_name }}_x64-setup.exe`
            - 🐧 **Linux AppImage**: `Glow_${{ github.ref_name }}_amd64.AppImage`
            - 🐧 **Linux Debian / Ubuntu**: `glow_${{ github.ref_name }}_amd64.deb`
            - 🐧 **Linux Fedora / RHEL**: `glow-${{ github.ref_name }}.x86_64.rpm`
            - 📱 **Android APK**: `Glow-${{ github.ref_name }}.apk`
          args: --target x86_64-pc-windows-msvc

  build-linux:
    name: 🐧 Build Linux Desktop App
    runs-on: ubuntu-22.04
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🏗️ Build frontend web assets
        run: npm run build

      - name: 🚀 Build and Release Tauri Desktop App for Linux
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Glow ✦ Skincare Companion ${{ github.ref_name }}'
          args: --bundles appimage,deb,rpm

      - name: 📦 Update RPM Repository on gh-pages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y createrepo-c
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          REPO_DIR=$(mktemp -d)
          git clone --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$REPO_DIR"
          
          mkdir -p "$REPO_DIR/rpm"
          
          find src-tauri/target/release/bundle/rpm -name "*.rpm" -exec cp {} "$REPO_DIR/rpm/" \;
          
          cd "$REPO_DIR"
          createrepo_c --verbose --update rpm/
          
          echo "[glow-tracker]" > rpm/glow-tracker.repo
          echo "name=Glow ✦ Skincare Companion Repository" >> rpm/glow-tracker.repo
          echo "baseurl=https://yorr-amd.github.io/glow/rpm/" >> rpm/glow-tracker.repo
          echo "enabled=1" >> rpm/glow-tracker.repo
          echo "gpgcheck=0" >> rpm/glow-tracker.repo
          echo "repo_gpgcheck=0" >> rpm/glow-tracker.repo
          echo "type=rpm-md" >> rpm/glow-tracker.repo

          cp rpm/glow-tracker.repo ./glow-tracker.repo
          touch .nojekyll
          
          git add .
          if git diff --staged --quiet; then
            echo "No changes in RPM repository"
          else
            git commit -m "chore(rpm-repo): update RPM metadata for ${{ github.ref_name }} [skip ci]"
            git push origin gh-pages
          fi